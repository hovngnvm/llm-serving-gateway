# Development Pipeline Configuration
pipeline_name: "financial_transaction_extraction"
version: "1.0.0"
seed: 42

model:
  base_model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  torch_dtype: "bfloat16"
  max_seq_length: 1024

dataset:
  raw_data_path: "training/data/raw/sample_financial_alpaca.jsonl"
  processed_dir: "training/data/processed"
  train_split_ratio: 0.90
  val_split_ratio: 0.10

qlora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

training:
  output_dir: "artifacts/runs/dev"
  per_device_train_batch_size: 2
  learning_rate: 2.0e-4
  num_train_epochs: 1

evaluation:
  metrics:
    - "json_validity_rate"
    - "schema_compliance_rate"
    - "field_level_accuracy"

intent_routing:
  adapter_name: "financial_adapter"
  description: "Fine-Tuned LoRA Adapter for Vietnamese Financial & Transaction Extraction"
  keywords:
    - "chuyển tiền"
    - "chuyển khoản"
    - "stk"
    - "số tài khoản"
    - "tài khoản"
    - "giao dịch"
    - "vnd"
    - "nạp tiền"
    - "rút tiền"
    - "sao kê"
    - "thẻ tín dụng"
    - "ngân hàng"
    - "vietcombank"
    - "techcombank"
    - "mbbank"
  regex_patterns:
    - "\\b\\d{1,3}(?:[.,]\\d{3})*\\s*(?:vnd|đ|dong|nghìn|triệu|k)\\b"
    - "(?i)\\b(?:stk|tk|số thẻ)[:\\s]*\\d{8,19}\\b"
